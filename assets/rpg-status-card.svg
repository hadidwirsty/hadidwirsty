<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-labelledby="rpgCardTitle rpgCardDesc">
  <title id="rpgCardTitle">Muhammad Hadid Wiransetyo - 16-bit RPG Character Sheet</title>
  <desc id="rpgCardDesc">Retro RPG status card detailing Muhammad Hadid Wiransetyo's fullstack engineering stats, marathon endurance attributes, and player vitals.</desc>
  <defs>
    <style>
      .bg-main { fill: #0b0f17; }
      .bg-panel { fill: #131923; }
      .bg-panel-inner { fill: #1a2230; }
      .bg-bar-track { fill: #090c12; }
      
      .border-outer { fill: #30363d; }
      .border-highlight { fill: #58a6ff; }
      .border-gold { fill: #d29922; }
      .border-green { fill: #238636; }
      
      .text-title { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 19px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
      .text-badge { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #f1e05a; letter-spacing: 0.5px; }
      .text-label { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #8b949e; letter-spacing: 0.5px; }
      .text-value { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .text-accent-green { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #3fb950; }
      .text-accent-blue { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #58a6ff; }
      .text-accent-gold { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #d29922; }
      .text-accent-purple { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #bc8cff; }
      .text-sub { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 10.5px; fill: #8b949e; }
      .text-status { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #3fb950; letter-spacing: 1px; }

      .hp-bar { fill: #2ea043; }
      .mp-bar { fill: #388bfd; }
      .stm-bar { fill: #d29922; }
      .exp-bar { fill: #8957e5; }
    </style>
  </defs>

  <!-- 16-BIT RETRO OUTER BEVEL BORDER -->
  <rect x="0" y="4" width="840" height="492" class="border-outer" />
  <rect x="4" y="0" width="832" height="500" class="border-outer" />
  <rect x="4" y="4" width="832" height="492" class="bg-main" />
  
  <!-- Frame Accent Inner Lines -->
  <rect x="10" y="10" width="820" height="480" fill="none" stroke="#21262d" stroke-width="2" />
  <rect x="12" y="12" width="816" height="2" class="border-highlight" />
  <rect x="12" y="486" width="816" height="2" class="border-green" />

  <!-- ==================== HEADER BOX ==================== -->
  <rect x="24" y="24" width="792" height="114" class="bg-panel" />
  <rect x="24" y="24" width="792" height="2" class="border-outer" />
  <rect x="24" y="136" width="792" height="2" class="border-outer" />

  <!-- Row 1: Level Badge, Hero Name, Save Point -->
  <rect x="36" y="34" width="170" height="26" class="bg-panel-inner" stroke="#d29922" stroke-width="1.5" />
  <text x="121" y="51" text-anchor="middle" class="text-badge">&#9670; LVL 2X ADVENTURER &#9670;</text>

  <text x="222" y="52" class="text-title">MUHAMMAD HADID WIRANSETYO</text>

  <text x="802" y="51" text-anchor="end" class="text-badge">&#9679; [SAVE POINT: ID]</text>

  <!-- Header Inner Divider Line -->
  <rect x="36" y="68" width="768" height="1" fill="#21262d" />

  <!-- Row 2 & 3: Character Metadata (Spacious 2-Column Grid) -->
  <!-- Left Column -->
  <text x="40" y="92" class="text-label">CLASS     :</text>
  <text x="136" y="92" class="text-value">Full-Stack Architect</text>

  <text x="40" y="118" class="text-label">SUB-CLASS :</text>
  <text x="136" y="118" class="text-value">Endurance Runner (Marathoner)</text>

  <!-- Right Column -->
  <text x="470" y="92" class="text-label">GUILD     :</text>
  <text x="566" y="92" class="text-value">Semarang &amp; Yogyakarta, ID</text>

  <text x="470" y="118" class="text-label">ALIGNMENT :</text>
  <text x="566" y="118" class="text-accent-green">Clean Code &amp; High Performance</text>


  <!-- ==================== LEFT PANEL: VITALS & BARS ==================== -->
  <rect x="24" y="148" width="386" height="274" class="bg-panel" />
  <rect x="24" y="148" width="386" height="2" class="border-outer" />

  <!-- Panel Title -->
  <rect x="36" y="160" width="362" height="22" class="bg-panel-inner" />
  <text x="46" y="175" class="text-badge">&#9632; PLAYER VITALS &amp; ENERGY</text>

  <!-- HP BAR -->
  <text x="40" y="204" class="text-accent-green">HP</text>
  <text x="68" y="204" class="text-sub">Coding Energy</text>
  <text x="398" y="204" text-anchor="end" class="text-value">100 / 100</text>
  <rect x="40" y="210" width="358" height="12" class="bg-bar-track" />
  <rect x="42" y="212" width="354" height="8" class="hp-bar" />
  <rect x="42" y="212" width="354" height="2" fill="#4ac26b" />

  <!-- MP BAR -->
  <text x="40" y="246" class="text-accent-blue">MP</text>
  <text x="68" y="246" class="text-sub">Problem Solving</text>
  <text x="398" y="246" text-anchor="end" class="text-value">99 / 99</text>
  <rect x="40" y="252" width="358" height="12" class="bg-bar-track" />
  <rect x="42" y="254" width="354" height="8" class="mp-bar" />
  <rect x="42" y="254" width="354" height="2" fill="#79c0ff" />

  <!-- STM BAR -->
  <text x="40" y="288" class="text-accent-gold">STM</text>
  <text x="74" y="288" class="text-sub">Marathon Base</text>
  <text x="398" y="288" text-anchor="end" class="text-value">42.2 / 42.2 km</text>
  <rect x="40" y="294" width="358" height="12" class="bg-bar-track" />
  <rect x="42" y="296" width="354" height="8" class="stm-bar" />
  <rect x="42" y="296" width="354" height="2" fill="#f1e05a" />

  <!-- EXP BAR -->
  <text x="40" y="330" class="text-accent-purple">EXP</text>
  <text x="74" y="330" class="text-sub">Senior Progress</text>
  <text x="398" y="330" text-anchor="end" class="text-value">88 / 100%</text>
  <rect x="40" y="336" width="358" height="12" class="bg-bar-track" />
  <rect x="42" y="338" width="310" height="8" class="exp-bar" />
  <rect x="42" y="338" width="310" height="2" fill="#d2a8ff" />

  <!-- Vitals Buff Box -->
  <rect x="36" y="372" width="362" height="36" class="bg-panel-inner" />
  <text x="48" y="394" class="text-sub" font-size="11px">&#9889; BUFF: Highly Caffeinated &amp; Aerobic Base</text>


  <!-- ==================== RIGHT PANEL: ATTRIBUTES ==================== -->
  <rect x="430" y="148" width="386" height="274" class="bg-panel" />
  <rect x="430" y="148" width="386" height="2" class="border-outer" />

  <!-- Panel Title -->
  <rect x="442" y="160" width="362" height="22" class="bg-panel-inner" />
  <text x="452" y="175" class="text-badge">&#9632; CORE ATTRIBUTES &amp; COMBAT SKILLS</text>

  <!-- INT STAT -->
  <rect x="442" y="194" width="46" height="32" class="bg-panel-inner" stroke="#388bfd" stroke-width="1" />
  <text x="465" y="215" text-anchor="middle" class="text-accent-blue" font-size="13px" font-weight="800">INT</text>
  <text x="498" y="206" class="text-value">+95 Backend Engineering</text>
  <text x="498" y="221" class="text-sub">Go, Node.js, Distributed Systems &amp; APIs</text>

  <!-- DEX STAT -->
  <rect x="442" y="236" width="46" height="32" class="bg-panel-inner" stroke="#3fb950" stroke-width="1" />
  <text x="465" y="257" text-anchor="middle" class="text-accent-green" font-size="13px" font-weight="800">DEX</text>
  <text x="498" y="248" class="text-value">+90 Frontend Craftsmanship</text>
  <text x="498" y="263" class="text-sub">React, TypeScript, Next.js, Modern UI</text>

  <!-- VIT STAT -->
  <rect x="442" y="278" width="46" height="32" class="bg-panel-inner" stroke="#d29922" stroke-width="1" />
  <text x="465" y="299" text-anchor="middle" class="text-accent-gold" font-size="13px" font-weight="800">VIT</text>
  <text x="498" y="290" class="text-value">+99 Endurance &amp; Discipline</text>
  <text x="498" y="305" class="text-sub">Marathon Grit, Daily Routine, Resilience</text>

  <!-- WIS STAT -->
  <rect x="442" y="320" width="46" height="32" class="bg-panel-inner" stroke="#bc8cff" stroke-width="1" />
  <text x="465" y="341" text-anchor="middle" class="text-accent-purple" font-size="13px" font-weight="800">WIS</text>
  <text x="498" y="332" class="text-value">+88 System Architecture</text>
  <text x="498" y="347" class="text-sub">TDD, Clean Code, Model Context Protocol</text>

  <!-- Trait Box -->
  <rect x="442" y="372" width="362" height="36" class="bg-panel-inner" />
  <text x="454" y="394" class="text-sub" font-size="11px">&#9874; SPECIAL TRAIT: Dual-Wielding Go &amp; TypeScript</text>


  <!-- ==================== FOOTER STATUS STRIP ==================== -->
  <rect x="24" y="434" width="792" height="42" class="bg-panel" />
  <rect x="24" y="434" width="792" height="1" class="border-outer" />
  <text x="40" y="460" class="text-status">&#9679; STATUS: ONLINE &amp; CRAFTING</text>
  <text x="802" y="460" text-anchor="end" class="text-value" font-size="11.5px">QUEST: Scalable Distributed Systems &amp; Marathon Training</text>
</svg>
