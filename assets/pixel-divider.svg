<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 24" width="100%" height="24" shape-rendering="crispEdges" role="separator" aria-label="16-bit Pixel Art Divider">
  <title>16-bit Pixel Art Divider</title>
  <defs>
    <style>
      .p-dark { fill: #131923; }
      .p-border { fill: #30363d; }
      .p-gold { fill: #d29922; }
      .p-gold-bright { fill: #f1e05a; }
      .p-green { fill: #238636; }
      .p-green-bright { fill: #3fb950; }
      .p-blue { fill: #388bfd; }
      .p-white { fill: #f0f6fc; }
    </style>
  </defs>

  <!-- Left horizontal continuous pixel track -->
  <rect x="0" y="10" width="392" height="4" class="p-border" />
  <rect x="0" y="11" width="392" height="2" class="p-green" />
  
  <!-- Left accent pixel gems -->
  <rect x="90" y="8" width="8" height="8" class="p-border" />
  <rect x="91" y="9" width="6" height="6" class="p-gold" />
  <rect x="93" y="11" width="2" height="2" class="p-gold-bright" />

  <rect x="210" y="8" width="8" height="8" class="p-border" />
  <rect x="211" y="9" width="6" height="6" class="p-green-bright" />
  <rect x="213" y="11" width="2" height="2" class="p-white" />

  <rect x="330" y="8" width="8" height="8" class="p-border" />
  <rect x="331" y="9" width="6" height="6" class="p-gold" />
  <rect x="333" y="11" width="2" height="2" class="p-gold-bright" />

  <!-- Center Pixel Artifact: 16-bit Crest (x=392 to x=448, width=56) -->
  <rect x="392" y="2" width="56" height="20" class="p-border" />
  <rect x="394" y="4" width="52" height="16" class="p-dark" />
  
  <!-- Center Pixel Heart / Gem -->
  <rect x="418" y="6" width="4" height="2" class="p-gold-bright" />
  <rect x="416" y="8" width="8" height="2" class="p-gold-bright" />
  <rect x="414" y="10" width="12" height="4" class="p-gold" />
  <rect x="416" y="14" width="8" height="2" class="p-gold" />
  <rect x="418" y="16" width="4" height="2" class="p-border" />

  <!-- Pixel Flanking Wings on Crest -->
  <rect x="398" y="7" width="4" height="10" class="p-green-bright" />
  <rect x="402" y="9" width="4" height="6" class="p-green" />
  <rect x="434" y="9" width="4" height="6" class="p-green" />
  <rect x="438" y="7" width="4" height="10" class="p-green-bright" />

  <!-- Right horizontal continuous pixel track -->
  <rect x="448" y="10" width="392" height="4" class="p-border" />
  <rect x="448" y="11" width="392" height="2" class="p-green" />

  <!-- Right accent pixel gems -->
  <rect x="502" y="8" width="8" height="8" class="p-border" />
  <rect x="503" y="9" width="6" height="6" class="p-gold" />
  <rect x="505" y="11" width="2" height="2" class="p-gold-bright" />

  <rect x="622" y="8" width="8" height="8" class="p-border" />
  <rect x="623" y="9" width="6" height="6" class="p-green-bright" />
  <rect x="625" y="11" width="2" height="2" class="p-white" />

  <rect x="742" y="8" width="8" height="8" class="p-border" />
  <rect x="743" y="9" width="6" height="6" class="p-gold" />
  <rect x="745" y="11" width="2" height="2" class="p-gold-bright" />
</svg>
